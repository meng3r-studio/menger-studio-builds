<title>Menger Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra fija → escaparate (banner rotativo) → estantería de carátulas 2:3 → buzón; la ficha es una capa a pantalla completa. */
:root {
  --ink: #07080f;        /* fondo */
  --deck: #10121f;       /* superficies */
  --deck-2: #181b2e;
  --line: #262a46;
  --text: #eceeff;
  --muted: #8d93bd;
  --amber: #ffb547;      /* acento cálido (fuego) */
  --cyan: #63e6ff;       /* acento frío (pantalla) */
  --good: #6ff2a4;
  --cone: #ff7a29;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace;
  --r: 14px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--ink); }
body {
  background: var(--ink); color: var(--text); font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut-r); }
.ico { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- barra ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--ink) 82%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.brand svg { width: 30px; height: 30px; }
.brand b { font: 800 15px/1 var(--display); letter-spacing: .14em; }
.brand b span { color: var(--amber); }
.nav { display: flex; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 8px; text-decoration: none; padding: 8px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px; }
.nav a:hover { color: var(--text); background: var(--deck-2); }
.lang { position: relative; }
.lang > button { display: flex; align-items: center; gap: 8px; background: var(--deck); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px 6px 7px; cursor: pointer; font-weight: 600; font-size: 13px; }
.flag { width: 24px; height: 16px; border-radius: 3px; overflow: hidden; flex: none; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
.lang ul { position: absolute; right: 0; top: calc(100% + 8px); list-style: none; margin: 0; padding: 6px; background: var(--deck); border: 1px solid var(--line); border-radius: 12px; min-width: 180px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.lang li button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; }
.lang li button:hover, .lang li button[aria-current="true"] { background: var(--deck-2); }
.lang li button[aria-current="true"]::after { content: "●"; margin-left: auto; color: var(--amber); font-size: 9px; }
@media (max-width: 720px) { .nav { display: none; } .lang .lname { display: none; } }

/* ---------- escaparate ---------- */
.hero { position: relative; padding-block: 20px 8px; }
.stage { position: relative; }
.frame { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 2 / 1; max-width: 100%; background: var(--deck); border: 1px solid var(--line); }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease, transform 6s ease; transform: scale(1.04); }
.slide.on { opacity: 1; transform: scale(1); }
.slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7,8,15,.92) 0%, rgba(7,8,15,0) 42%); pointer-events: none; }
.stage-ui { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; align-items: flex-end; gap: 16px; padding: 22px 24px; flex-wrap: wrap; }
.stage-ui .who { margin-right: auto; display: grid; gap: 8px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); letter-spacing: .02em; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px); white-space: nowrap; }
.chip.hot { background: color-mix(in srgb, var(--amber) 20%, transparent); border-color: color-mix(in srgb, var(--amber) 45%, transparent); color: #ffe0ad; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none; font: 700 14px/1 var(--body); padding: 13px 18px; border-radius: 999px; background: var(--text); color: var(--ink); white-space: nowrap; }
.btn:hover { background: #fff; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid rgba(255,255,255,.18); }
.btn.ghost:hover { background: rgba(255,255,255,.14); }
.btn.amber { background: var(--amber); color: #241400; }
.dots { position: absolute; top: 16px; right: 18px; z-index: 2; display: flex; gap: 6px; }
.dots button { width: 26px; height: 4px; border: 0; padding: 0; border-radius: 4px; background: rgba(255,255,255,.3); cursor: pointer; }
.dots button.on { background: var(--amber); }
@media (max-width: 640px) {
  .frame { border-radius: 16px; }
  .frame::after { background: linear-gradient(0deg, rgba(7,8,15,.5) 0%, rgba(7,8,15,0) 30%); }
  .stage-ui { position: static; padding: 12px 0 0; gap: 10px; flex-wrap: nowrap; align-items: center; }
  .dots { top: 10px; right: 12px; }
  .stage-ui .chips .chip:nth-child(n+3) { display: none; }
}

/* ---------- títulos de sección ---------- */
.sec { padding-block: 36px 8px; }
.sec-h { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
.sec-h .badge { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--deck-2); border: 1px solid var(--line); color: var(--amber); }
.sec-h .badge .ico { width: 20px; height: 20px; }
.sec-h h2 { font: 700 clamp(18px, 2.4vw, 22px)/1.1 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
.sec-h .count { margin-left: auto; font: 500 12px var(--mono); color: var(--muted); }

/* ---------- estantería ---------- */
.shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } }
.card { position: relative; display: block; text-decoration: none; border-radius: var(--r); overflow: hidden; aspect-ratio: 2 / 3; max-width: 100%; background: var(--deck); border: 1px solid var(--line); transition: transform .25s ease, box-shadow .25s ease, border-color .25s; cursor: pointer; padding: 0; width: 100%; text-align: left; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card:hover, .card:focus-visible { transform: translateY(-6px); box-shadow: 0 22px 50px -18px var(--glow, rgba(99,230,255,.45)); border-color: color-mix(in srgb, var(--glow, var(--cyan)) 60%, transparent); }
.card .meta { position: absolute; inset: auto 0 0 0; padding: 40px 12px 12px; display: flex; align-items: center; gap: 10px; background: linear-gradient(0deg, rgba(7,8,15,.95), rgba(7,8,15,0)); }
.card .meta .plats { display: flex; gap: 6px; color: var(--muted); margin-left: auto; }
.card .meta .ring { width: 44px; height: 44px; }
.card .meta .ring text { font: 700 11px var(--body); }
.card .tag { position: absolute; top: 10px; left: 10px; }

/* ---------- anillo de % ---------- */
.ring circle { fill: none; }
.ring .bg { stroke: rgba(255,255,255,.12); }
.ring .fg { stroke: var(--ringc, var(--good)); stroke-linecap: round; transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1); }
.ring text { fill: var(--text); text-anchor: middle; dominant-baseline: central; }

/* ---------- buzón ---------- */
.fb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .fb-grid { grid-template-columns: 1fr; } }
.fb-pick { display: flex; align-items: center; gap: 16px; padding: 22px; border-radius: 18px; border: 1px solid var(--line); background: var(--deck); cursor: pointer; text-align: left; transition: border-color .2s, background .2s; }
.fb-pick:hover { border-color: #3a3f66; }
.fb-pick[aria-pressed="true"] { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 8%, var(--deck)); }
.fb-pick .big { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.fb-pick .big .ico { width: 28px; height: 28px; }
.fb-pick b { display: block; font: 700 16px/1.2 var(--display); }
.fb-pick small { color: var(--muted); font-size: 14px; }
.fb-form { margin-top: 16px; padding: 22px; border-radius: 18px; background: var(--deck); border: 1px solid var(--line); display: grid; gap: 14px; }
.fb-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .fb-row { grid-template-columns: 1fr; } }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; background: var(--ink); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 400 15px/1.4 var(--body); }
.f textarea { min-height: 120px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--cyan); }
.fb-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fb-msg { font-size: 14px; color: var(--muted); }
.fb-msg.ok { color: var(--good); }
.fb-msg.err { color: #ff9b8a; }
.inbox { margin-top: 18px; display: grid; gap: 10px; }
.inbox article { padding: 14px 16px; border-radius: 12px; background: var(--deck-2); border: 1px solid var(--line); }
.inbox header { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.inbox p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- pie ---------- */
footer { margin-top: 56px; border-top: 1px solid var(--line); padding-block: 28px 40px; color: var(--muted); font-size: 13px; }
footer .wrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
footer .flags { display: flex; gap: 6px; margin-left: auto; }
footer .flags button { background: none; border: 0; padding: 3px; cursor: pointer; border-radius: 5px; opacity: .55; }
footer .flags button[aria-current="true"], footer .flags button:hover { opacity: 1; }

/* ---------- ficha ---------- */
.sheet { position: fixed; inset: 0; z-index: 80; background: var(--ink); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .close { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); z-index: 5; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(7,8,15,.7); backdrop-filter: blur(8px); cursor: pointer; display: grid; place-items: center; }
.backdrop { position: relative; height: clamp(200px, 38vw, 440px); overflow: hidden; }
.backdrop img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(1.1); }
.backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--ink) 0%, rgba(7,8,15,.55) 45%, rgba(7,8,15,.1) 100%); }
.head { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; margin-top: -130px; position: relative; z-index: 2; }
.head .poster { grid-row: span 2; width: 100%; aspect-ratio: 2 / 3; max-width: 100%; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }
.head .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.head h1 { font: 800 clamp(28px, 5vw, 52px)/1 var(--display); margin: 60px 0 12px; letter-spacing: .01em; text-wrap: balance; }
.head .lead { grid-column: 2; align-self: start; font-size: 18px; color: #c8ccef; max-width: 62ch; margin: 0; }
.head .acts { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 700px) {
  .head { grid-template-columns: 120px minmax(0, 1fr); gap: 16px; margin-top: -80px; }
  .head h1 { margin-top: 44px; font-size: 26px; }
  .head .poster { grid-row: auto; }
  .head .lead { grid-column: 1 / -1; font-size: 16px; }
  .head .acts { grid-column: 1 / -1; }
}
.blocks { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; margin-top: 34px; }
.blk { grid-column: span 6; background: var(--deck); border: 1px solid var(--line); border-radius: 18px; padding: 20px; min-width: 0; }
.blk.wide { grid-column: 1 / -1; }
.blk.third { grid-column: span 4; }
.blk.two3 { grid-column: span 8; }
@media (max-width: 900px) { .blk, .blk.third, .blk.two3 { grid-column: 1 / -1; } }
.blk h3 { display: flex; align-items: center; gap: 10px; font: 700 15px/1.2 var(--display); letter-spacing: .03em; margin: 0 0 16px; }
.blk h3 .ico { color: var(--amber); width: 20px; height: 20px; }
.blk h3 small { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); letter-spacing: 0; }

.status { display: flex; align-items: center; gap: 18px; width: 100%; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.status .ring { width: 110px; height: 110px; flex: none; }
.status .ring text { font: 800 22px var(--display); }
.status .hint { display: grid; gap: 4px; }
.status .hint b { font: 700 16px var(--body); }
.status .hint span { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.status .chev { transition: transform .25s; }
.status[aria-expanded="true"] .chev { transform: rotate(180deg); }
.bars { display: grid; gap: 12px; margin-top: 18px; }
.bars .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 14px; }
.bars .row span:last-child { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bars .track { grid-column: 1 / -1; height: 8px; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; }
.bars .fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--ringc, var(--good)), color-mix(in srgb, var(--ringc, var(--good)) 60%, #fff)); width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bars .note { font-size: 12px; color: var(--muted); }

.demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.demo { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; background: var(--deck-2); min-width: 0; }
.demo .top { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.demo .top .ico { width: 22px; height: 22px; color: var(--cyan); }
.demo .top em { margin-left: auto; font: 600 11px var(--body); font-style: normal; padding: 4px 8px; border-radius: 999px; background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.demo .qr { background: #fff; border-radius: 10px; padding: 10px; width: 152px; max-width: 100%; aspect-ratio: 1; display: grid; place-items: center; justify-self: center; }
.demo .qr img, .demo .qr canvas { width: 100% !important; height: auto !important; display: block; }
.demo .url { font: 500 11.5px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.demo .warn { font-size: 12.5px; color: #ffd9a6; display: flex; gap: 6px; }
.demo .warn .ico { color: var(--amber); margin-top: 2px; }
.demo.soon { background: repeating-linear-gradient(-45deg, rgba(255,122,41,.06) 0 14px, transparent 14px 28px), var(--deck-2); border-style: dashed; }
.demo.soon .top .ico { color: var(--muted); }
.demo.soon .cone { width: 74px; height: 74px; justify-self: center; }
.demo.soon .lbl { justify-self: center; font: 700 13px var(--display); letter-spacing: .06em; color: var(--cone); text-transform: uppercase; }

dl.tech { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 18px; margin: 0; font-size: 14px; }
dl.tech dt { color: var(--muted); display: flex; align-items: center; gap: 8px; }
dl.tech dd { margin: 0; font-weight: 600; }
ul.credits, ul.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.credits li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; font-size: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
ul.credits li:last-child { border-bottom: 0; padding-bottom: 0; }
ul.credits .who { color: var(--muted); font-size: 13px; }
ul.credits .lic { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 600 11px var(--mono); padding: 4px 8px; border-radius: 6px; background: var(--ink); border: 1px solid var(--line); white-space: nowrap; }
ul.credits .lic.by { border-color: var(--amber); color: var(--amber); }
ul.credits a { color: var(--cyan); }
ul.todo li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
ul.todo li .ico { color: var(--cyan); margin-top: 2px; }
.gallery { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
.gallery img { height: 200px; width: auto; border-radius: 10px; scroll-snap-align: start; border: 1px solid var(--line); flex: none; }
@media (max-width: 640px) { .gallery img { height: 150px; } }
.repo { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: var(--deck-2); border: 1px solid var(--line); text-decoration: none; }
.repo + .repo { margin-top: 10px; }
.repo .ico { width: 26px; height: 26px; }
.repo div { min-width: 0; display: grid; }
.repo b { font: 500 13px var(--mono); overflow-wrap: anywhere; }
.repo small { color: var(--muted); display: flex; gap: 6px; align-items: center; }
.repo .pill { margin-left: auto; font: 600 11px var(--body); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.repo .pill.priv { background: rgba(255,255,255,.07); color: var(--muted); }
.repo .pill.pub { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<main id="top">
  <section class="hero wrap" aria-label="Destacados">
    <div class="stage">
      <div class="frame" id="stage"><div class="dots" id="dots"></div></div>

        <div class="who">
          <div class="chips" id="stageChips"></div>
        </div>
        <button class="btn" id="stageOpen"><svg class="ico"><use href="#i-play"/></svg><span data-t="open"></span></button>
      </div>
    </div>
  </section>

  <section class="sec wrap" id="juegos">
    <div class="sec-h"><span class="badge"><svg class="ico"><use href="#i-pad"/></svg></span><h2 data-t="games"></h2><span class="count" id="gameCount"></span></div>
    <div class="shelf" id="shelf"></div>
  </section>

  <section class="sec wrap" id="feedback">
    <div class="sec-h"><span class="badge"><svg class="ico"><use href="#i-bulb"/></svg></span><h2 data-t="fbTitle"></h2></div>
    <div class="fb-grid">
      <button class="fb-pick" data-kind="improve" aria-pressed="true">
        <span class="big" style="background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan)"><svg class="ico"><use href="#i-wrench"/></svg></span>
        <span><b data-t="fbImprove"></b><small data-t="fbImproveSub"></small></span>
      </button>
      <button class="fb-pick" data-kind="new" aria-pressed="false">
        <span class="big" style="background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)"><svg class="ico"><use href="#i-rocket"/></svg></span>
        <span><b data-t="fbNew"></b><small data-t="fbNewSub"></small></span>
      </button>
    </div>
    <form class="fb-form" id="fbForm" novalidate>
      <div class="fb-row">
        <label class="f" id="fGameWrap"><span data-t="fGame"></span><select id="fGame"></select></label>
        <label class="f" id="fTitleWrap" hidden><span data-t="fTitle"></span><input id="fTitle" maxlength="80"></label>
        <label class="f"><span data-t="fName"></span><input id="fName" maxlength="60" autocomplete="nickname"></label>
      </div>
      <label class="f"><span data-t="fIdea"></span><textarea id="fIdea" maxlength="2000" required></textarea></label>
      <div class="fb-actions">
        <button class="btn amber" type="submit"><svg class="ico"><use href="#i-arrow"/></svg><span data-t="send"></span></button>
        <a class="btn ghost" id="fbGh" href="#" target="_blank" rel="noopener"><svg class="ico"><use href="#i-gh"/></svg><span data-t="sendGh"></span></a>
        <span class="fb-msg" id="fbMsg" role="status"></span>
      </div>
    </form>
    <div id="inboxWrap" hidden>
      <div class="sec-h" style="margin-top:28px"><span class="badge"><svg class="ico"><use href="#i-inbox"/></svg></span><h2 data-t="inbox"></h2><span class="count" id="inboxCount"></span></div>
      <div class="inbox" id="inbox"></div>
    </div>
  </section>
</main>

    tech: {engine:"Godot", version:"4.7.2", stack:"GDScript · 2D pixel art", platforms:["linux","windows","web"], langs:"ES"},
    credits: [

      {w:"Spooky Dungeon", a:"Memoraphile / You're Perfect Studio", lic:"CC0", url:"https://opengameart.org/content/spooky-dungeon"},
      {w:"16x16 Weapon RPG Icons", a:"Shade", lic:"CC0", url:"https://opengameart.org/content/16x16-weapon-rpg-icons"},
      {w:"RPG Audio", a:"Kenney", lic:"CC0", url:"https://kenney.nl/assets/rpg-audio"},

      {w:"own", a:"Menger Studio", lic:"—", own:{es:"101 preguntas, efectos sintetizados y todo el código", en:"101 questions, synthesized sounds and all code", ca:"101 preguntes, sons sintetitzats i tot el codi", fr:"101 questions, sons synthétisés et tout le code", de:"101 Fragen, synthetische Sounds und der ganze Code", it:"101 domande, suoni sintetizzati e tutto il codice", pt:"101 perguntas, sons sintetizados e todo o código"}}

      {es:"Sprites nuevos de Pixel Crawler", en:"New Pixel Crawler sprites", ca:"Sprites nous de Pixel Crawler", fr:"Nouveaux sprites Pixel Crawler", de:"Neue Pixel-Crawler-Sprites", it:"Nuovi sprite di Pixel Crawler", pt:"Sprites novos do Pixel Crawler"},
      {es:"Un jefe vampiro con sprite propio", en:"A vampire boss with its own sprite", ca:"Un cap vampir amb sprite propi", fr:"Un boss vampire avec son propre sprite", de:"Ein Vampir-Boss mit eigenem Sprite", it:"Un boss vampiro con il suo sprite", pt:"Um chefe vampiro com sprite próprio"},
      {es:"Preguntas más difíciles en cada piso", en:"Harder questions on deeper floors", ca:"Preguntes més difícils a cada pis", fr:"Questions plus dures à chaque étage", de:"Schwerere Fragen auf tieferen Etagen", it:"Domande più difficili a ogni piano", pt:"Perguntas mais difíceis em cada piso"},
      {es:"Pantallas de título y créditos", en:"Title and credits screens", ca:"Pantalles de títol i crèdits", fr:"Écrans titre et crédits", de:"Titel- und Credits-Bildschirm", it:"Schermate di titolo e crediti", pt:"Ecrãs de título e créditos"}
    ],

];

/* ===================== utilidades ===================== */
let lang = "es";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t = k => (UI[k] && (UI[k][lang] || UI[k].es)) || k;
const L = o => (o && (o[lang] || o.es)) || "";
const ico = (id, cls = "ico") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

function pctOf(g) {
  const s = g.status;
  if (s.overall != null) return s.overall;
  const d = s.parts.reduce((a, p) => a + p.d, 0), tt = s.parts.reduce((a, p) => a + p.t, 0);
  return Math.round(100 * d / tt);
}
function ring(pct, size, stroke, color, label) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, len = c * pct / 100;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" style="--ringc:${color}" role="img" aria-label="${pct}%">
    <circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
    <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${len} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%">${label ?? pct + "%"}</text></svg>`;
}

/* logo: alfombra de Menger de nivel 2 */
(function logo() {
  const el = $("#logo"); let h = "";
  const hole = (x, y) => { while (x || y) { if (x % 3 === 1 && y % 3 === 1) return true; x = Math.floor(x / 3); y = Math.floor(y / 3); } return false; };
  for (let y = 0; y < 9; y++) for (let x = 0; x < 9; x++) if (!hole(x, y)) {
    const warm = (x + y) % 4 === 0;
    h += `<rect x="${x*3}" y="${y*3}" width="2.4" height="2.4" rx=".5" fill="${warm ? "#ffb547" : "#63e6ff"}" opacity="${warm ? 1 : .85}"/>`;
  }
  el.innerHTML = h;
})();

/* ===================== portada ===================== */
let slideIdx = 0, slideTimer = null;
function renderStage() {
  const stage = $("#stage");
  stage.querySelectorAll(".slide").forEach(n => n.remove());
  const dots = $("#dots"); dots.innerHTML = "";
  GAMES.forEach((g, i) => {
    const s = document.createElement("div");
    s.className = "slide" + (i === slideIdx ? " on" : "");
    s.innerHTML = `<img src="img/${g.id}-banner.webp" alt="${esc(g.name)}" ${i ? 'loading="lazy"' : ""}>`;
    stage.insertBefore(s, stage.firstChild);
    const b = document.createElement("button");
    b.setAttribute("aria-label", g.name);
    if (i === slideIdx) b.className = "on";
    b.onclick = () => { showSlide(i); restartTimer(); };
    dots.appendChild(b);
  });
  showSlide(slideIdx);
}
function showSlide(i) {
  slideIdx = (i + GAMES.length) % GAMES.length;
  const slides = [...$("#stage").querySelectorAll(".slide")].reverse();
  slides.forEach((s, k) => s.classList.toggle("on", k === slideIdx));
  [...$("#dots").children].forEach((d, k) => d.classList.toggle("on", k === slideIdx));
  const g = GAMES[slideIdx];
  $("#stageChips").innerHTML =
    `<span class="chip hot">${ico("i-pad")}${esc(L(g.genre))}</span>` +
    `<span class="chip">${ico("i-chart")}${pctOf(g)}% ${esc(t("done"))}</span>` +
    `<span class="chip">${ico("i-cpu")}${esc(g.tech.engine)} ${esc(g.tech.version.split(" ")[0])}</span>` +
    `<span class="chip">${ico("i-users")}${esc(g.players)}</span>`;
  $("#stageOpen").onclick = () => openGame(g.id);
}
function restartTimer() {
  clearInterval(slideTimer);
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  slideTimer = setInterval(() => { if (!document.hidden && $("#sheet").hidden) showSlide(slideIdx + 1); }, 6000);
}

function renderShelf() {
  $("#gameCount").textContent = String(GAMES.length).padStart(2, "0");
  $("#shelf").innerHTML = GAMES.map(g => `
    <button class="card" style="--glow:${g.glow}" data-open="${g.id}" aria-label="${esc(g.name)} · ${esc(L(g.genre))}">
      <img src="img/${g.id}-poster.webp" alt="" loading="lazy">
      <span class="meta">
        ${ring(pctOf(g), 44, 4, g.color)}
        <span class="plats">${g.tech.platforms.map(p => ico(PLAT[p].ico)).join("")}</span>
      </span>
    </button>`).join("");
  $("#shelf").querySelectorAll("[data-open]").forEach(b => b.onclick = () => openGame(b.dataset.open));
}

/* ===================== ficha ===================== */
let current = null, lastFocus = null;
function openGame(id, fromHash) {
  const g = GAMES.find(x => x.id === id); if (!g) return;
  current = id;
  if (!fromHash) { lastFocus = document.activeElement; try { history.replaceState(null, "", "#" + id); } catch {} }
  renderSheet();
  $("#sheet").hidden = false;
  $("#sheet").scrollTop = 0;
  document.body.style.overflow = "hidden";
  $("#sheetClose").focus();
}
function closeGame() {
  current = null;
  $("#sheet").hidden = true;
  document.body.style.overflow = "";
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  if (lastFocus) lastFocus.focus();
}
function renderSheet() {
  const g = GAMES.find(x => x.id === current); if (!g) return;
  const pct = pctOf(g), s = g.status;
  const bars = s.parts.map(p => {
    const v = p.p != null ? p.p : Math.round(100 * p.d / p.t);
    const right = p.p != null ? v + "%" : `${p.d}/${p.t}`;
    return `<div class="row"><span>${esc(L(p.l))}</span><span>${right}</span><div class="track"><div class="fill" data-w="${v}"></div></div></div>`;
  }).join("");
  const totals = s.overall == null ? (() => { const d = s.parts.reduce((a, p) => a + p.d, 0), tt = s.parts.reduce((a, p) => a + p.t, 0); return `${t("tasksNote")} ${s.tasks}: ${d}/${tt}.`; })() : t("estimate");

  const demos = g.demos.map((d, i) => {
    const pl = PLAT[d.plat];
    if (!d.url) return `<div class="demo soon">
        <div class="top">${ico(pl.ico)}${pl.name}</div>
        <svg class="cone" viewBox="0 0 64 64" aria-hidden="true"><use href="#cone"/></svg>
        <span class="lbl">${esc(t("soon"))}</span></div>`;
    return `<div class="demo">
        <div class="top">${ico(pl.ico)}${pl.name}<em>${esc(t("avail"))}</em></div>
        <div class="qr" data-qr="${esc(d.url)}" title="${esc(t("scan"))}"></div>
        <a class="btn ${d.kind === "play" ? "amber" : ""}" href="${esc(d.url)}" target="_blank" rel="noopener">${ico(d.kind === "play" ? "i-play" : "i-dl")}${esc(t(d.kind === "play" ? "play" : "download"))}${d.size ? ` · ${d.size}` : ""}</a>
        <span class="url">${esc(d.url.replace(/^https:\/\//, ""))}</span>
        ${d.warn ? `<span class="warn">${ico("i-alert")}<span>${esc(t(d.warn))}</span></span>` : ""}
      </div>`;
  }).join("");

  const repos = g.repos.map(r => `<a class="repo" href="${r.url}" target="_blank" rel="noopener">${ico("i-gh")}<div><b>${esc(r.label)}</b>${r.priv ? `<small>${ico("i-lock")}${esc(t("privNote"))}</small>` : ""}</div><span class="pill ${r.priv ? "priv" : "pub"}">${esc(t(r.priv ? "private" : "public"))}</span></a>`).join("")
    + (g.demos.some(d => d.kind === "dl") ? `<a class="repo" href="https://github.com/mengerspong3/menger-studio-builds" target="_blank" rel="noopener">${ico("i-dl")}<div><b>mengerspong3/menger-studio-builds</b><small>${esc(t("buildsRepo"))}</small></div><span class="pill pub">${esc(t("public"))}</span></a>` : "");

  const credits = g.credits.map(c => {
    const lic = c.lic === "paid" ? t("paid") : c.lic === "toCheck" ? t("toCheck") : c.lic;
    const name = c.w === "own" ? `<b>${esc(t("ownWork"))}</b>` : c.url ? `<a href="${c.url}" target="_blank" rel="noopener">${esc(c.w)}</a>` : esc(c.w);
    const who = c.w === "own" ? L(c.own) : c.a;
    return `<li><span>${name}</span><span class="lic ${c.by ? "by" : ""}">${esc(lic)}</span><span class="who">${esc(who)}</span></li>`;
  }).join("");

  const tech = g.tech;
  $("#sheetBody").innerHTML = `
    <div class="backdrop"><img src="img/${g.id}-banner.webp" alt=""></div>
    <div class="wrap">
      <div class="head">
        <div class="poster"><img src="img/${g.id}-poster.webp" alt="${esc(g.name)}"></div>
        <div style="min-width:0">
          <h1 id="sheetTitle">${esc(g.name)}</h1>
          <div class="chips">
            <span class="chip hot">${ico("i-pad")}${esc(L(g.genre))}</span>
            <span class="chip">${ico("i-users")}${esc(g.players)}</span>
            <span class="chip">${ico("i-lang")}${esc(tech.langs)}</span>
          </div>
        </div>
        <p class="lead">${esc(L(g.desc))}</p>
      </div>

      <div class="blocks">
        <section class="blk third">
          <h3>${ico("i-chart")}${esc(t("status"))}</h3>
          <button class="status" aria-expanded="false" aria-controls="bars-${g.id}">
            ${ring(pct, 110, 10, g.color)}
            <span class="hint"><b>${pct}% ${esc(t("done"))}</b><span>${esc(t("tapBreak"))} ${ico("i-down", "ico chev")}</span></span>
          </button>
          <div class="bars" id="bars-${g.id}" style="--ringc:${g.color}" hidden>${bars}<span class="note">${esc(totals)}</span></div>
        </section>

        <section class="blk two3">
          <h3>${ico("i-play")}${esc(t("demos"))}<small>${esc(t("scan"))}</small></h3>
          <div class="demos">${demos}</div>
        </section>

        <section class="blk">
          <h3>${ico("i-cpu")}${esc(t("tech"))}</h3>
          <dl class="tech">
            <dt>${ico("i-cpu")}${esc(t("engine"))}</dt><dd>${esc(tech.engine)}</dd>
            <dt>${ico("i-box")}${esc(t("version"))}</dt><dd>${esc(tech.version)}</dd>
            <dt>${ico("i-wrench")}${esc(t("stack"))}</dt><dd>${esc(tech.stack)}</dd>
            <dt>${ico("i-globe")}${esc(t("platforms"))}</dt><dd>${tech.platforms.map(p => {
              const ok = g.demos.some(d => d.plat === p && d.url);
              return `<span class="chip" style="margin:0 4px 4px 0;${ok ? "" : "opacity:.55"}">${ico(PLAT[p].ico)}${PLAT[p].name}${ok ? "" : " · " + esc(t("soon"))}</span>`;
            }).join("")}</dd>
            <dt>${ico("i-users")}${esc(t("players"))}</dt><dd>${esc(g.players)}</dd>
            <dt>${ico("i-lang")}${esc(t("langs"))}</dt><dd>${esc(tech.langs)}</dd>
          </dl>
        </section>

        <section class="blk">
          <h3>${ico("i-gh")}${esc(t("code"))}</h3>
          ${repos}
        </section>

        <section class="blk">
          <h3>${ico("i-box")}${esc(t("credits"))}</h3>
          <ul class="credits">${credits}</ul>
        </section>

        <section class="blk">
          <h3>${ico("i-wrench")}${esc(t("todo"))}</h3>
          <ul class="todo">${g.todo.map(x => `<li>${ico("i-arrow")}<span>${esc(L(x))}</span></li>`).join("")}</ul>
        </section>

        ${g.shots.length ? `<section class="blk wide">
          <h3>${ico("i-img")}${esc(t("shots"))}</h3>
          <div class="gallery">${g.shots.map(s => `<img src="img/${s}.webp" alt="${esc(g.name)}" loading="lazy">`).join("")}</div>
        </section>` : ""}
      </div>
    </div>`;

  const sb = $("#sheetBody .status"), bx = $("#bars-" + g.id);
  sb.onclick = () => {
    const open = sb.getAttribute("aria-expanded") !== "true";
    sb.setAttribute("aria-expanded", String(open));
    bx.hidden = !open;
    requestAnimationFrame(() => requestAnimationFrame(() => bx.querySelectorAll(".fill").forEach(f => f.style.width = open ? f.dataset.w + "%" : "0")));
  };
  drawQRs();
}
function drawQRs() {
  $("#sheetBody").querySelectorAll("[data-qr]").forEach(el => {
    el.innerHTML = "";
    if (typeof QRCode === "undefined") { el.innerHTML = ico("i-phone"); return; }
    new QRCode(el, { text: el.dataset.qr, width: 256, height: 256, colorDark: "#07080f", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    const img = el.querySelector("img"); if (img) img.alt = "QR";
  });
}

$("#sheetClose").onclick = closeGame;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeGame(); });

/* ===================== idioma ===================== */
function renderLangUI() {
  $("#langFlag").innerHTML = FLAGS[lang];
  $("#langName").textContent = LANGS.find(l => l[0] === lang)[1];
  $("#langMenu").innerHTML = LANGS.map(([c, n]) => `<li><button role="option" data-lang="${c}" aria-current="${c === lang}" lang="${c}">${FLAGS[c]}${n}</button></li>`).join("");
  $("#footFlags").innerHTML = LANGS.map(([c, n]) => `<button data-lang="${c}" aria-current="${c === lang}" title="${n}" aria-label="${n}">${FLAGS[c]}</button>`).join("");
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { setLang(b.dataset.lang); toggleMenu(false); });
}
function toggleMenu(open) {
  const m = $("#langMenu"), b = $("#langBtn");
  open = open ?? m.hidden;
  m.hidden = !open; b.setAttribute("aria-expanded", String(open));
}
$("#langBtn").onclick = e => { e.stopPropagation(); toggleMenu(); };
document.addEventListener("click", e => { if (!e.target.closest(".lang")) toggleMenu(false); });

function setLang(l) {
  lang = LANGS.some(x => x[0] === l) ? l : "es";
  store.set("ms-lang", lang);
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = t(n.dataset.t));
  $("footer [data-t=footFonts]").textContent = t("footFonts") + " · " + t("coverFonts");
  renderLangUI();
  showSlide(slideIdx);
  renderShelf();
  renderGameSelect();
  updateGhLink();
  if (current) renderSheet();
  renderInbox();
}

/* ===================== buzón ===================== */
let kind = "improve";
document.querySelectorAll(".fb-pick").forEach(b => b.onclick = () => {
  kind = b.dataset.kind;
  document.querySelectorAll(".fb-pick").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  $("#fGameWrap").hidden = kind !== "improve";
  $("#fTitleWrap").hidden = kind !== "new";
  setMsg("");
  updateGhLink();
});
function renderGameSelect() {
  const v = $("#fGame").value;
  $("#fGame").innerHTML = GAMES.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join("");
  if (v) $("#fGame").value = v;
}
function setMsg(txt, cls = "") { const m = $("#fbMsg"); m.textContent = txt; m.className = "fb-msg " + cls; }
function payload() {
  return {
    kind,
    game: kind === "improve" ? $("#fGame").value : null,
    title: kind === "new" ? $("#fTitle").value.trim().slice(0, 80) : null,
    text: $("#fIdea").value.trim().slice(0, 2000),
    name: $("#fName").value.trim().slice(0, 60),
    lang,
    createdAt: Date.now()
  };
}
function updateGhLink() {
  const p = payload();
  const gname = p.game ? (GAMES.find(g => g.id === p.game) || {}).name : null;
  const title = kind === "improve" ? `[Idea] ${gname}` : `[Nuevo juego] ${p.title || ""}`.trim();
  const body = `${p.text || ""}\n\n— ${kind === "improve" ? gname : t("newGame")} · ${lang}`;
  $("#fbGh").href = "https://github.com/mengerspong3/menger-studio-builds/issues/new?" +
    new URLSearchParams({ title, body, labels: kind === "improve" ? "idea" : "nuevo-juego" }).toString();
}
["#fIdea", "#fTitle", "#fGame"].forEach(s => $(s).addEventListener("input", updateGhLink));

let db = null, user = null, myId = null;
$("#fbForm").addEventListener("submit", async e => {
  e.preventDefault();
  const p = payload();
  if (!p.text) { setMsg(t("empty"), "err"); $("#fIdea").focus(); return; }
  if (!db || !myId) { setMsg(t("noWrite"), "err"); return; }
  setMsg(t("sending"));
  try {
    await db.collection(`feedback/${myId}/items`).add(p);
    await db.doc(`feedback/${myId}`).set({ last: p.createdAt });
    setMsg(t("sent"), "ok");
    $("#fIdea").value = ""; $("#fTitle").value = "";
    updateGhLink();
  } catch (err) {
    setMsg(t("noWrite"), "err");
  }
});

/* bandeja: solo la ve el dueño */
let inboxItems = [];
function renderInbox() {
  if ($("#inboxWrap").hidden) return;
  $("#inboxCount").textContent = String(inboxItems.length).padStart(2, "0");
  const box = $("#inbox");
  if (!inboxItems.length) { box.innerHTML = `<p style="color:var(--muted)">${esc(t("inboxEmpty"))}</p>`; return; }
  box.innerHTML = inboxItems.map(x => {
    const g = GAMES.find(g => g.id === x.game);
    const what = x.kind === "improve" ? (g ? g.name : x.game) : `${t("newGame")}${x.title ? " · " + x.title : ""}`;
    const when = new Date(x.createdAt || 0).toLocaleString(lang);
    return `<article><header>${ico(x.kind === "improve" ? "i-wrench" : "i-rocket")}<b style="color:var(--text)">${esc(what)}</b><span>· ${esc(x.name || t("anon"))}</span><span>· ${esc(x.lang || "")}</span><span style="margin-left:auto">${esc(when)}</span></header><p>${esc(x.text || "")}</p></article>`;
  }).join("");
}
async function startInbox() {
  const parents = await db.collection("feedback").get();
  const all = [];
  for (const d of parents.docs) {
    const items = await db.collection(`feedback/${d.id}/items`).get();
    items.docs.forEach(it => all.push(it.data()));
  }
  inboxItems = all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  $("#inboxWrap").hidden = false;
  renderInbox();
}

async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (user) {
      try { myId = await user.id(); } catch {}
      if (db && await user.isOwner()) {
        try { await startInbox(); } catch {}
        db.collection("feedback").onSnapshot(() => { startInbox().catch(() => {}); });
      }
    }
  } catch {}
}

/* ===================== arranque ===================== */
function initialLang() {
  const saved = store.get("ms-lang");
  if (saved) return saved;
  const nav = (navigator.language || "es").toLowerCase();
  const hit = LANGS.find(([c]) => nav.startsWith(c));
  return hit ? hit[0] : "en";
}
renderStage();
setLang(initialLang());
restartTimer();
const h = (location.hash || "").slice(1);
if (GAMES.some(g => g.id === h)) openGame(h, true);
else if (h === "feedback") $("#feedback").scrollIntoView();
connect();
})();
</script>
